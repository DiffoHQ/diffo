name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to a SHA, not a tag: this job runs on `pull_request_target` with a
        # writable token, so a retagged upstream release must not silently change
        # what executes here. ca4a40a is tag v2.6.1.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          # Must be the repo's real URL or the bot links signers to a 404.
          path-to-document: 'https://github.com/DiffoHQ/diffo/blob/main/CLA.md'
          # One-time setup: this branch must exist before the first signature
          # (the action writes via the contents API, which cannot create branches):
          #   git push origin main:cla-signatures
          # Keep it unprotected.
          branch: 'cla-signatures'
          allowlist: aviranhuga,dependabot[bot],renovate[bot]
