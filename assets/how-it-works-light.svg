<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" width="880" height="690" role="img" aria-label="Diffo architecture, animated, agent-first: your coding agent writes the code and opens the review; a local Diffo server watches the changeset; the agent starts diffo poll while the review opens in your browser; your comments and Finish review return to the agent through the poll; the agent answers and fixes, the review updates live, and the agent polls again.">
